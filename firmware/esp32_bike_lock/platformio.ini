[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
board_build.mcu = esp32c3

; NimBLE — легковесный BLE стек, экономит память
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_NIMBLE_CPP_ENABLE_RETURN_CODE_TEXT=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
    ; ID велосипеда генерируется АВТОМАТИЧЕСКИ из BLE MAC адреса
; (последние 4 hex символа → "42_CAMPUS_BIKE_A1B2")
; Одна прошивка на ВСЕ платы без изменений.
; Публичный ключ бэкенда (Ed25519, 32 байта) — заменить на реальный
    -DBACKEND_PUBLIC_KEY_HEX=\"1f4fdb37377f2a8b6f597e90b2310854c2bee639a3d633c43fcdce45d1cfb08e\"