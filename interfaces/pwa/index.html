<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00babc">
  <meta name="description" content="42 Campus Bike Sharing — Аренда велосипеда">
  <title>42 Campus Bike</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚲</text></svg>">

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            '42cyan': '#00babc',
            '42dark': '#1a1a2e',
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .pulse { animation: pulse 2s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body class="bg-42dark text-white min-h-screen flex flex-col items-center justify-center p-4">

  <main class="w-full max-w-md">
    <!-- Заголовок -->
    <div class="text-center mb-8">
      <span class="text-6xl">🚲</span>
      <h1 class="text-2xl font-bold mt-2">42 Campus Bike</h1>
      <p class="text-gray-400 text-sm" id="bike-id-display">Загрузка...</p>
    </div>

    <!-- Статус -->
    <div id="status-card" class="bg-gray-800 rounded-2xl p-6 mb-6 text-center">
      <p id="status-text" class="text-lg">Нажмите "Подключиться" для начала</p>
      <p id="progress-text" class="text-sm text-gray-400 mt-2"></p>
    </div>

    <!-- Прогресс -->
    <div id="progress-bar" class="w-full bg-gray-700 rounded-full h-2 mb-6 hidden">
      <div id="progress-fill" class="bg-42cyan h-2 rounded-full transition-all duration-500"
           style="width: 0%"></div>
    </div>

    <!-- Кнопки -->
    <div class="space-y-3">
      <button id="btn-connect"
              class="w-full py-4 bg-42cyan text-black font-bold rounded-xl text-lg
                     hover:bg-opacity-90 active:scale-95 transition-all">
        🔵 Подключиться к велосипеду
      </button>

      <button id="btn-rent"
              class="w-full py-4 bg-green-600 text-white font-bold rounded-xl text-lg
                     hover:bg-opacity-90 active:scale-95 transition-all hidden">
        🔓 Арендовать
      </button>

      <button id="btn-reset"
              class="w-full py-3 bg-gray-700 text-gray-300 rounded-xl text-sm
                     hover:bg-gray-600 active:scale-95 transition-all hidden">
        🔄 Сбросить
      </button>
    </div>

    <!-- Инструкция -->
    <div id="instructions" class="mt-8 bg-gray-800 bg-opacity-50 rounded-xl p-4 text-sm text-gray-400">
      <p class="font-bold text-gray-300 mb-2">📋 Как это работает:</p>
      <ol class="list-decimal list-inside space-y-1">
        <li>Подключитесь к велосипеду по Bluetooth</li>
        <li>Авторизуйтесь через 42 Intra</li>
        <li>Нажмите "Арендовать" — замок откроется</li>
      </ol>
    </div>
  </main>

  <!-- Индикатор подключения -->
  <div id="connection-indicator" class="fixed top-4 right-4 flex items-center gap-2 hidden">
    <span class="w-3 h-3 bg-green-500 rounded-full pulse"></span>
    <span class="text-xs text-green-400">BLE</span>
  </div>

  <!-- Скрипт Web Bluetooth -->
  <script src="app.js"></script>
</body>
</html>
